<section class="page-header">
    <span class="tag">CONTACT US</span>
    <h1>We'd love to hear from you.</h1>
    <p>Have a question, suggestion or feedback about CivilFix?</p>
</section>
<section class="contact-grid">
    <div class="contact-info">
        <div class="contact-item"><span><img class="icons" src="email.png"></span><div><strong>Email</strong><p>civilfix@gov.service.com</p></div></div>
        <div class="contact-item"><span><img class="icons" src="mobile.png"></span><div><strong>Phone</strong><p>+91 9132192389</p></div></div>
        <div class="contact-item"><span><img class="icons" src="map.png"></span><div><strong>Location</strong><p>Mumbai, India</p></div></div>
    </div>
    <form class="form-card" action="user_save.php" method="POST">
        <input type="hidden" name="form_type" value="contact">
        <label>Name</label>
        <input type="text" name="name" required placeholder="Your name">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
        <label>Message</label>
        <textarea name="message" required placeholder="Write your message..."></textarea>
        <button class="button" type="submit">Send Message</button>
    </form>
</section>

<footer>
    <div>
        <strong>CivilFix</strong>
        <p>Report civic problems. Improve your community.</p>
    </div>

</footer>
