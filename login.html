<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CivilFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <a class="brand" href="index.html">
            <img src="civilfix-logo.png" alt="CivilFix">
        </a>
        <div class="navlinks">
            <a href="index.html">Home</a>
            <a href="report.html">Report</a>
            <a href="issues.html">Issues</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a class="highlight" href="login.html">Login</a>
        </div>
    </nav>

    <section class="login-section">
        <div class="login-card">
            <h1>Login</h1>
            <p class="muted">Create your account or save your details.</p>
            <form action="user_save.php" method="POST">
                <input type="hidden" name="form_type" value="login">
                <label>Name</label>
                <input type="text" name="name" required placeholder="Your name">
                <label>Email</label>
                <input type="email" name="email" required placeholder="you@example.com">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Your password">
                <button class="button full" type="submit">Continue</button>
            </form>
        </div>
    </section>

    <footer>
        <div>
            <strong>CivilFix</strong>
            <p>Report civic problems. Improve your community.</p>
        </div>
        <p>© 2026 CivilFix</p>
    </footer>
</body>
</html>
